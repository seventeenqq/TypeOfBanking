name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Test ViewModel
        run: dotnet test tests/CurrencyConverter.Tests -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
      - name: Publish server
        run: dotnet publish src/CurrencyConverter.Server -c Release -o artifacts/server
      - name: Install MAUI for Android
        run: dotnet workload install maui-android
      - name: Install Android SDK components
        run: >-
          dotnet build src/CurrencyConverter.App -t:InstallAndroidDependencies
          -f net10.0-android -p:AppTargetFramework=net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSdkLicenses=True
      - name: Build Android APK
        run: >-
          dotnet build src/CurrencyConverter.App -t:SignAndroidPackage -c Debug
          -f net10.0-android -p:AppTargetFramework=net10.0-android
          -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-android
          path: src/CurrencyConverter.App/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error
      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-server
          path: artifacts/server
